name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after successful checks and build
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        id: version
        run: python scripts/versioning.py check
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Windows terminal checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File terminal-setup/tests/Test-Core.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File terminal-setup/tests/Test-TerminalHost.ps1
          exit $LASTEXITCODE
      - name: Prepare verified browser engine
        run: python scripts/fetch-browser.py
      - name: UI interaction checks
        run: bun run test:ui
      - name: Build Windows installer
        run: bun run build:windows
      - name: Verify release payload and hashes
        run: python scripts/verify-custom-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: fakecc-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            releases/${{ steps.version.outputs.version }}/fakecc.exe
            releases/${{ steps.version.outputs.version }}/SHA256SUMS
            releases/${{ steps.version.outputs.version }}/verification.json
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fakecc-windows-${{ needs.build.outputs.version }}
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Keeping all published assets unchanged."
            exit 0
          fi
          cat > notes.md <<'EOF'
          Windows x64 安装包：下载 fakecc.exe 安装，SHA256SUMS 用于核对完整性。

          推荐使用终端 Claude Code，通过 claude setup-token 完成官方授权。向导在本机保护 token，四项商业资源与官方认证分开。

          此版本通过自动检查、构建及安装载荷核对。安装器尚未 Authenticode 签名；这些检查不代替真实设备安装和账号授权验收。
          EOF
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "fakecc $RELEASE_TAG" --notes-file notes.md release/fakecc.exe release/SHA256SUMS release/verification.json
