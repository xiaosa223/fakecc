name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build:custom
      - run: python scripts/versioning.py check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Windows local setup checks
        shell: powershell
        run: |
          & ./terminal-setup/tests/Test-Core.ps1
          & ./terminal-setup/tests/Test-TerminalHost.ps1
